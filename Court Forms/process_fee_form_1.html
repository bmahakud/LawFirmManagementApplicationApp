<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Process Fee (Compact)</title>
<style>
  @page{ size: A4; margin: 12mm 15mm; }
  *{box-sizing:border-box;}
  html,body{
    margin:0;
    background:#fff;
    font-family:"Times New Roman", Times, serif;
    color:#000;
  }
  body{ padding:0; }

  .sheet{
    position: relative;
    width:210mm;
    min-height:297mm;
    margin:0 auto;
    padding:12mm 16mm;
    font-size:13px;
    line-height:1.5;
    background: #fff;
  }

  .title{
    text-align:center;
    font-size:24px;
    letter-spacing:4px;
    font-weight:bold;
    text-transform:uppercase;
    margin:4px 0 18px;
  }

  .field-line{
    display:flex;
    align-items:baseline;
    gap:8px;
    margin-bottom:10px;
    font-size:13px;
  }
  .field-line .lbl{
    white-space:nowrap;
    font-weight:600;
  }

  .versus-line{
    text-align:center;
    font-size:13px;
    font-style:italic;
    font-weight:bold;
    margin:6px 0;
  }

  .suit-row{
    display:flex;
    justify-content:space-between;
    gap:20px;
    font-size:13px;
    margin-bottom:14px;
  }
  .suit-row .lbl{
    white-space:nowrap;
    font-weight:600;
  }

  table.fee-table{
    width:100%;
    border-collapse:collapse;
    font-size:12px;
    margin-bottom:16px;
  }
  table.fee-table th{
    border:1px solid #333;
    padding:6px 4px;
    font-weight:bold;
    text-align:center;
    background:#f1f5f9;
    font-size:11.5px;
  }
  table.fee-table td{
    border:1px solid #333;
    height:28px;
    padding:2px 3px;
    vertical-align:middle;
  }

  .footer-row{
    display:flex;
    justify-content:space-between;
    margin-top:28px;
    font-size:12.5px;
  }
  .footer-row .footer-sign-col{
    width:42%;
    text-align:center;
    position:relative;
  }
  .footer-row .footer-sign-col .sign-label{
    border-top:1px solid #333;
    padding-top:4px;
    font-weight:bold;
    font-size:12.5px;
  }

  /* Interactive semantic form inputs */
  .cf-inline-input {
    font-family: "Times New Roman", Times, serif;
    font-size: 13px;
    font-weight: 700;
    color: #000000;
    border: none;
    border-bottom: 1.5px dotted #475569;
    background: rgba(241, 245, 249, 0.45);
    padding: 2px 6px;
    outline: none;
    border-radius: 2px;
    box-sizing: border-box;
    transition: all 0.15s ease-in-out;
  }
  .cf-inline-input:focus {
    background: #eff6ff;
    border-bottom: 2px solid #2563eb;
    box-shadow: 0 1px 3px rgba(37, 99, 235, 0.15);
  }
  .cf-inline-input::placeholder {
    color: #94a3b8;
    font-style: italic;
    font-weight: normal;
  }

  .cf-table-input {
    width: 100%;
    border: none;
    background: rgba(241, 245, 249, 0.35);
    font-family: "Times New Roman", Times, serif;
    font-size: 11.5px;
    font-weight: 700;
    color: #000000;
    padding: 3px 5px;
    outline: none;
    box-sizing: border-box;
    border-radius: 2px;
    transition: all 0.15s ease-in-out;
  }
  .cf-table-input:focus {
    background: #eff6ff;
    box-shadow: inset 0 0 0 1.5px #2563eb;
  }
  .cf-table-input::placeholder {
    color: #94a3b8;
    font-style: italic;
    font-weight: normal;
  }

  .text-center { text-align: center; }
  .text-right { text-align: right; }

  @media print{
    body{ padding:0 !important; background:#fff !important; }
    .sheet{
      width:auto !important;
      min-height:0 !important;
      margin:0 !important;
      padding:6mm 10mm !important;
      box-shadow:none !important;
    }
    .cf-inline-input, .cf-table-input {
      border:none !important;
      background:transparent !important;
      color:#000 !important;
      font-weight:bold !important;
      box-shadow:none !important;
      padding:0 !important;
    }
    .cf-inline-input {
      border-bottom:1px dotted #333 !important;
    }
    .cf-inline-input::placeholder, .cf-table-input::placeholder {
      color:transparent !important;
    }
    .sig-space {
      display:none !important;
    }
  }

  @media (max-width:800px){
    .sheet{ width:100%; padding:6mm; }
    .suit-row{ flex-direction:column; gap:8px; }
  }
</style>
</head>
