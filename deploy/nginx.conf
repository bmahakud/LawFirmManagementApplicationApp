server {
    server_name antlegal.anthemgt.com 157.245.101.58;

    # Backend: Proxy /api/ and /admin/ to Gunicorn
    location ~ ^/(api|admin) {
        include proxy_params;
        proxy_pass http://unix:/home/sammy/LawFirmManagementApplicationApp/backend/gunicorn.sock;
    }

    # Backend: Serve Static and Media Files with CORS headers
    location /static/ {
        alias /home/sammy/LawFirmManagementApplicationApp/backend/staticfiles/;
        add_header 'Access-Control-Allow-Origin' '*' always;
        add_header 'Access-Control-Allow-Methods' 'GET, HEAD, OPTIONS' always;
        add_header 'Access-Control-Allow-Headers' '*' always;
        if ($request_method = 'OPTIONS') {
            add_header 'Access-Control-Allow-Origin' '*' always;
            add_header 'Access-Control-Allow-Methods' 'GET, HEAD, OPTIONS' always;
            add_header 'Access-Control-Allow-Headers' '*' always;
            add_header 'Content-Type' 'text/plain charset=UTF-8';
            add_header 'Content-Length' 0;
            return 204;
        }
    }

    location /media/ {
        alias /home/sammy/LawFirmManagementApplicationApp/backend/media/;
        add_header 'Access-Control-Allow-Origin' '*' always;
        add_header 'Access-Control-Allow-Methods' 'GET, HEAD, OPTIONS' always;
        add_header 'Access-Control-Allow-Headers' '*' always;
        if ($request_method = 'OPTIONS') {
            add_header 'Access-Control-Allow-Origin' '*' always;
            add_header 'Access-Control-Allow-Methods' 'GET, HEAD, OPTIONS' always;
            add_header 'Access-Control-Allow-Headers' '*' always;
            add_header 'Content-Type' 'text/plain charset=UTF-8';
            add_header 'Content-Length' 0;
            return 204;
        }
    }

    # Frontend: Proxy everything else to Next.js (PM2)
    location / {
        proxy_pass http://localhost:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/antlegal.anthemgt.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/antlegal.anthemgt.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

server {
    if ($host = antlegal.anthemgt.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    listen 80;
    server_name antlegal.anthemgt.com 157.245.101.58;
    return 404; # managed by Certbot
}
